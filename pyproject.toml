[project]
name = "minecraft-parkour-rl"
version = "0.1.0"
description = "Tabular Q-learning on a local Minecraft parkour course"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
ppo = [
  "gymnasium==1.4.0",
  "stable-baselines3==2.9.2",
  "torch>=2.8,<3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local", "bridge/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["parkour", "tools", "tests"]

[tool.ty.rules]
possibly-missing-attribute = "error"
